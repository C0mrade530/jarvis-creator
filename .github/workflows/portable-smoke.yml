name: Portable startup

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: portable-source
          path: dist/Jarvis-Creator-*-source.zip
          if-no-files-found: error

  startup:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          name: portable-source
          path: portable-source
      - name: Start Jarvis from the release ZIP
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import socket
          import subprocess
          import sys
          import tempfile
          import time
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          from zipfile import ZipFile

          archive, = Path("portable-source").glob("*.zip")
          windows = sys.platform == "win32"
          with tempfile.TemporaryDirectory(prefix="Jarvis Creator ") as temp:
              folder = Path(temp) / "Проверка запуска"
              with ZipFile(archive) as source:
                  source.extractall(folder)
                  unix_mode = source.getinfo("jarvis-creator/jarvis").external_attr >> 16
              project = folder / "jarvis-creator"
              if windows:
                  launcher = [os.environ["COMSPEC"], "/d", "/c", "jarvis.cmd"]
              else:
                  assert unix_mode & 0o100, "ZIP dropped the Unix launcher executable bit"
                  (project / "jarvis").chmod(unix_mode & 0o777)
                  launcher = [str(project / "jarvis")]
              env = {**os.environ, "JARVIS_CREATOR_HOME": str(folder / "User Data")}
              doctor = subprocess.check_output(
                  [*launcher, "doctor"], cwd=project, env=env, encoding="utf-8", timeout=15
              )
              assert "Python 3." in doctor and sys.platform in doctor, doctor
              profile = subprocess.check_output(
                  [*launcher, "profile", "--name", "Тестовый Автор", "--complete"],
                  cwd=project, env=env, encoding="utf-8", timeout=15,
              )
              assert json.loads(profile)["name"] == "Тестовый Автор"

              with socket.socket() as reservation:
                  reservation.bind(("127.0.0.1", 0))
                  port = reservation.getsockname()[1]
              base = f"http://127.0.0.1:{port}"
              with tempfile.TemporaryFile() as log:
                  process = subprocess.Popen(
                      [*launcher, "start", "--no-open", "--port", str(port)],
                      cwd=project, env=env, stdout=log, stderr=log,
                  )
                  try:
                      for attempt in range(60):
                          status = process.poll()
                          if status is not None:
                              raise RuntimeError(f"Jarvis exited before startup with status {status}")
                          try:
                              with urlopen(base + "/healthz", timeout=1) as response:
                                  assert json.load(response)["ok"] is True
                              break
                          except OSError:
                              time.sleep(0.25)
                      else:
                          raise RuntimeError("Jarvis did not become ready on loopback")

                      with urlopen(base + "/", timeout=5) as response:
                          html = response.read().decode("utf-8")
                          assert "Jarvis Creator" in html and "portable.js" in html
                      with urlopen(base + "/portable.js", timeout=5) as response:
                          assert response.status == 200 and response.read().strip()

                      log.seek(0)
                      prefix = f"Jarvis: {base}/#jarvis="
                      session = log.readline().decode("utf-8").strip()
                      assert session.startswith(prefix), "Jarvis did not print its session URL"
                      token = session.removeprefix(prefix)
                      assert token and token.isascii()

                      def action(name, token=None, *, value=None, origin=base):
                          headers = {"Content-Type": "application/json", "Origin": origin}
                          if token:
                              headers["X-Jarvis-Token"] = token
                          body = json.dumps({"action": name, "value": value}).encode("utf-8")
                          request = Request(
                              base + "/api/action", body, headers
                          )
                          with urlopen(request, timeout=5) as response:
                              return json.load(response)

                      for credentials in ({}, {"token": token, "origin": "https://invalid.example"}):
                          try:
                              action("profile-get", **credentials)
                          except HTTPError as error:
                              assert error.code == 403
                          else:
                              raise AssertionError("Jarvis accepted an unauthorized profile request")
                      state = action("profile-get", token)
                      assert state["profile"]["name"] == "Тестовый Автор"
                      assert state["profile"]["onboarded"] is True
                      assert action("start", token)["report"]["text"]
                      answer = action(
                          "ask", token, value={"question": "К кому обратиться для организации съёмок вживую?"}
                      )["assistant"]
                      assert answer["recommendation"] == "leo-creator"
                      assert "@leo_ai_content" in answer["reply"]
                  finally:
                      if process.poll() is None:
                          if windows:
                              subprocess.run(
                                  ["taskkill", "/PID", str(process.pid), "/T", "/F"],
                                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                                  timeout=10, check=False,
                              )
                          else:
                              process.terminate()
                      process.wait(timeout=10)
